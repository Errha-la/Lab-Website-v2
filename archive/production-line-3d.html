<style>
  html,body{margin:0;height:100%}
  body{background:var(--color-bg);color:var(--color-text);font-family:"Barlow","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column}
  h1,h2{font-family:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{flex:1;min-height:0;display:block}
  header{flex:none;border-bottom:1px solid var(--color-divider);padding:16px 26px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  footer{flex:none;border-top:1px solid var(--color-divider);padding:10px 26px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .bar{flex:none;border-bottom:1px solid var(--color-divider);padding:9px 26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--color-neutral-100)}
  .kk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.18em;color:var(--color-neutral-600);margin-right:2px}
  button.t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.09em;padding:5px 11px;border:1px solid var(--color-divider);background:transparent;color:var(--color-accent-700);cursor:pointer}
  button.t:hover{background:var(--color-accent-100)}
  button.t[aria-pressed="true"]{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  button.t:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
  .key{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--color-neutral-700)}
  .sw{width:12px;height:12px;border:1px solid rgba(29,45,61,.25)}
  #stat{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.06em;color:var(--color-neutral-700);margin-left:auto}
</style>
</head>
<body>
  <header>
    <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--color-accent-700)">FIG. 01 — 3D</span>
    <h1 style="margin:0;font-size:25px">閉環智慧製造產線</h1>
    <span style="font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.02em;color:var(--color-accent-700)">Closed-loop Smart Production Line</span>
    <span style="margin-left:auto;font-size:12.5px;color:var(--color-neutral-600)">開發檢測環境 · 拖曳旋轉 · 滾輪縮放 · 可下載 OBJ / GLB</span>
  </header>

  <div class="bar">
    <span class="kk">VIEW</span>
    <button class="t" data-view="wide">全線遠景</button>
    <button class="t" data-view="s01">01 感測</button>
    <button class="t" data-view="s02">02 診斷</button>
    <button class="t" data-view="s03">03 決策</button>
    <button class="t" data-view="s04">04 控制</button>
    <button class="t" data-view="s05">05 回饋</button>
    <button class="t" data-view="graze">掠射光</button>
    <span class="kk" style="margin-left:14px">DEBUG</span>
    <button class="t" id="bWire" aria-pressed="false">線架</button>
    <button class="t" id="bNorm" aria-pressed="false">法線</button>
    <button class="t" id="bAnim" aria-pressed="true">動態</button>
    <button class="t" id="bLow" aria-pressed="false">手機簡化版</button>
    <span id="stat">—</span>
  </div>

  <three-d-stage name="closed-loop-line" background="#f2f2f3"></three-d-stage>

  <footer>
    <span class="key"><span class="sw" style="background:#5980a6"></span>01 振動感測 · 加速度計陣列</span>
    <span class="key"><span class="sw" style="background:#41617f"></span>02 故障診斷 · 工業攝影機</span>
    <span class="key"><span class="sw" style="background:#2c455d"></span>03 決策優化 · 排程看板</span>
    <span class="key"><span class="sw" style="background:#94bce3"></span>04 製程控制 · PLC + 手臂</span>
    <span class="key"><span class="sw" style="background:#7a7a7d"></span>05 品質回饋 · SPC 管制圖</span>
    <span class="key" style="margin-left:auto">單位：公尺 · 環心置於原點 · y 軸向上</span>
  </footer>

  <script src="../assets/js/three-d-stage.js"></script>
  <script type="module">
    import { buildLine, STATION_R } from './line-model.js';

    const stage = document.querySelector('three-d-stage');
    const { THREE } = await stage.ready;

    let line = null, animOn = true, wire = false, norm = false, low = false;
    let t0 = performance.now();

    function build() {
      if (line) { line.dispose(); }
      line = buildLine(THREE, { accent: '#5980a6', detail: low ? 'low' : 'high', shadows: !low });
      applyDebug();
      stage.setObject(line.group);
      let tris = 0, meshes = 0;
      line.group.traverse(o => {
        if (!o.isMesh) return;
        meshes++;
        const g = o.geometry;
        tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
      });
      document.getElementById('stat').textContent =
        (low ? 'LOW · ' : 'HIGH · ') + meshes + ' NAMED MESHES · ' + Math.round(tris).toLocaleString() + ' TRIS';
    }

    function applyDebug() {
      if (!line) return;
      const mats = Object.values(line.materials);
      mats.forEach(m => { m.wireframe = wire; });
      line.group.traverse(o => {
        if (!o.isMesh) return;
        if (norm) {
          if (!o.userData._m) o.userData._m = o.material;
          o.material = o.userData._nm || (o.userData._nm = new THREE.MeshNormalMaterial({ flatShading: true }));
        } else if (o.userData._m) {
          o.material = o.userData._m;
        }
      });
    }

    /* 固定檢視點（visual-validation：同一組視角比對每次修改） */
    const views = {
      wide:  { az: Math.PI / 2, el: 0.62, d: 1.0 },
      s01:   { station: 0 }, s02: { station: 1 }, s03: { station: 2 },
      s04:   { station: 3 }, s05: { station: 4 },
      graze: { az: 0.2, el: 0.12, d: 0.72 }
    };
    function goView(key) {
      const v = views[key]; if (!v || !line) return;
      const cam = stage._camera, ctr = stage._controls;
      if (!cam) return;
      const R = line.bounds.radius;
      let target, az, el, dist;
      if (v.station != null) {
        const a = line.anchors[v.station];
        target = a.position.clone(); target.y *= 0.72;
        az = a.angle; el = 0.26; dist = 4.6;
      } else {
        target = line.bounds.center.clone();
        az = v.az; el = v.el; dist = R * 2.1 * v.d;
      }
      cam.position.set(
        target.x + Math.cos(az) * Math.cos(el) * dist,
        target.y + Math.sin(el) * dist,
        target.z + Math.sin(az) * Math.cos(el) * dist
      );
      if (ctr) { ctr.target.copy(target); ctr.update(); }
      cam.lookAt(target);
      cam.updateProjectionMatrix();
    }

    document.querySelectorAll('[data-view]').forEach(b =>
      b.addEventListener('click', () => goView(b.dataset.view)));
    const tog = (id, fn) => {
      const b = document.getElementById(id);
      b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on));
        fn(on);
      });
    };
    tog('bWire', v => { wire = v; applyDebug(); });
    tog('bNorm', v => { norm = v; applyDebug(); });
    tog('bAnim', v => { animOn = v; });
    tog('bLow', v => { low = v; build(); goView('wide'); });

    build();
    goView('wide');

    (function loop() {
      if (line && animOn) line.update((performance.now() - t0) / 1000);
      requestAnimationFrame(loop);
    })();

    window.addEventListener('beforeunload', () => { if (line) line.dispose(); });
  </script>
</body>
</html>
